<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HaskTreeView - Visualizador de Dependências</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #header {
            padding: 20px;
            text-align: center;
            background-color: #111;
            border-bottom: 2px solid #333;
        }

        #header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        #header p {
            color: #888;
            font-size: 14px;
        }

        #controls {
            padding: 15px;
            background-color: #111;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
        }

        #controls label {
            color: #fff;
            font-size: 14px;
        }

        #controls input[type="file"] {
            padding: 8px 15px;
            background-color: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
        }

        #controls button {
            padding: 8px 20px;
            background-color: #0066cc;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        #controls button:hover {
            background-color: #0052a3;
        }

        #canvas-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 160px);
            overflow: auto;
        }

        canvas {
            display: block;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        #info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: rgba(17, 17, 17, 0.95);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            max-width: 300px;
            display: none;
        }

        #info h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #0066cc;
        }

        #info p {
            font-size: 13px;
            margin: 5px 0;
            color: #ccc;
        }

        #info .label {
            color: #888;
            font-weight: bold;
        }

        #stats {
            position: fixed;
            top: 180px;
            right: 20px;
            background-color: rgba(17, 17, 17, 0.95);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            min-width: 200px;
        }

        #stats h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #0066cc;
        }

        #stats p {
            font-size: 12px;
            margin: 5px 0;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>🌳 HaskTreeView</h1>
        <p>Visualizador de Árvore de Dependências</p>
    </div>

    <div id="controls">
        <label for="fileInput">Carregar JSON:</label>
        <input type="file" id="fileInput" accept=".json">
        <button onclick="resetView()">Resetar Visualização</button>
        <button onclick="loadDefaultJson()">Carregar Exemplo</button>
    </div>

    <div id="canvas-container">
        <canvas id="canvas"></canvas>
    </div>

    <div id="info">
        <h3 id="info-title">Informações do Nó</h3>
        <p><span class="label">Arquivo:</span> <span id="info-file"></span></p>
        <p><span class="label">Importa:</span> <span id="info-imports"></span></p>
        <p><span class="label">Importado por:</span> <span id="info-imported-by"></span></p>
    </div>

    <div id="stats">
        <h3>Estatísticas</h3>
        <p><span class="label">Projeto:</span> <span id="stat-project">-</span></p>
        <p><span class="label">Total de arquivos:</span> <span id="stat-files">0</span></p>
        <p><span class="label">Total de conexões:</span> <span id="stat-connections">0</span></p>
        <p><span class="label">Analisado em:</span> <span id="stat-date">-</span></p>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const infoPanel = document.getElementById('info');

        let data = null;
        let nodes = [];
        let connections = [];
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let lastX = 0;
        let lastY = 0;
        let scale = 1;

        // Configurações visuais
        const NODE_RADIUS = 20;
        const NODE_COLOR = '#fff';
        const NODE_HOVER_COLOR = '#0066cc';
        const LINE_COLOR = '#fff';
        const LINE_WIDTH = 2;
        const VERTICAL_SPACING = 150;
        const HORIZONTAL_SPACING = 200;

        // Inicializar canvas
        function initCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            offsetX = canvas.width / 2;
            offsetY = 100;
        }

        // Carregar JSON do input
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        data = JSON.parse(event.target.result);
                        processData();
                        draw();
                    } catch (error) {
                        alert('Erro ao carregar JSON: ' + error.message);
                    }
                };
                reader.readAsText(file);
            }
        });

        // Carregar JSON padrão
        function loadDefaultJson() {
            fetch('dependencies.json')
                .then(response => response.json())
                .then(jsonData => {
                    data = jsonData;
                    processData();
                    draw();
                })
                .catch(error => {
                    alert('Erro ao carregar JSON padrão: ' + error.message);
                });
        }

        // Processar dados do JSON
        function processData() {
            if (!data) return;

            nodes = [];
            connections = [];

            // Atualizar estatísticas
            document.getElementById('stat-project').textContent = data.projectName || '-';
            document.getElementById('stat-files').textContent = data.dependencies.length;
            document.getElementById('stat-date').textContent = data.analyzedAt || '-';

            // Identificar nós raiz (sem importedBy)
            const rootNodes = data.dependencies.filter(dep => dep.importedBy.length === 0);
            const processedNodes = new Set();

            // Calcular profundidade de cada nó
            const depthMap = {};
            const queue = rootNodes.map(node => ({ id: node.fileId, depth: 0 }));

            while (queue.length > 0) {
                const { id, depth } = queue.shift();
                if (processedNodes.has(id)) continue;

                processedNodes.add(id);
                depthMap[id] = depth;

                const node = data.dependencies.find(d => d.fileId === id);
                if (node) {
                    node.imports.forEach(importId => {
                        if (!processedNodes.has(importId)) {
                            queue.push({ id: importId, depth: depth + 1 });
                        }
                    });
                }
            }

            // Organizar nós por profundidade
            const nodesByDepth = {};
            data.dependencies.forEach(dep => {
                const depth = depthMap[dep.fileId] || 0;
                if (!nodesByDepth[depth]) nodesByDepth[depth] = [];
                nodesByDepth[depth].push(dep);
            });

            // Posicionar nós
            Object.keys(nodesByDepth).forEach(depth => {
                const nodesAtDepth = nodesByDepth[depth];
                const totalWidth = (nodesAtDepth.length - 1) * HORIZONTAL_SPACING;
                const startX = -totalWidth / 2;

                nodesAtDepth.forEach((dep, index) => {
                    const filePath = data.fileRegistry[dep.fileId] || dep.fileId;
                    nodes.push({
                        id: dep.fileId,
                        x: startX + index * HORIZONTAL_SPACING,
                        y: depth * VERTICAL_SPACING,
                        filePath: filePath,
                        imports: dep.imports,
                        importedBy: dep.importedBy
                    });
                });
            });

            // Criar conexões
            let connectionCount = 0;
            data.dependencies.forEach(dep => {
                dep.imports.forEach(importId => {
                    const from = nodes.find(n => n.id === dep.fileId);
                    const to = nodes.find(n => n.id === importId);
                    if (from && to) {
                        connections.push({ from, to });
                        connectionCount++;
                    }
                });
            });

            document.getElementById('stat-connections').textContent = connectionCount;
        }

        // Desenhar tudo
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);

            // Desenhar conexões
            ctx.strokeStyle = LINE_COLOR;
            ctx.lineWidth = LINE_WIDTH;
            connections.forEach(conn => {
                ctx.beginPath();
                ctx.moveTo(conn.from.x, conn.from.y);
                ctx.lineTo(conn.to.x, conn.to.y);
                ctx.stroke();
            });

            // Desenhar nós
            nodes.forEach(node => {
                ctx.beginPath();
                ctx.arc(node.x, node.y, NODE_RADIUS, 0, Math.PI * 2);
                ctx.fillStyle = node.hover ? NODE_HOVER_COLOR : NODE_COLOR;
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Desenhar texto do arquivo
                ctx.fillStyle = '#fff';
                ctx.font = '12px monospace';
                ctx.textAlign = 'center';
                const fileName = node.filePath.split(/[\/\\]/).pop();
                ctx.fillText(fileName, node.x, node.y + NODE_RADIUS + 15);
            });

            ctx.restore();
        }

        // Eventos de mouse
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left - offsetX) / scale;
            const mouseY = (e.clientY - rect.top - offsetY) / scale;

            if (isDragging) {
                offsetX += e.clientX - lastX;
                offsetY += e.clientY - lastY;
                lastX = e.clientX;
                lastY = e.clientY;
                draw();
            } else {
                // Detectar hover
                let hovering = false;
                nodes.forEach(node => {
                    const dist = Math.sqrt((mouseX - node.x) ** 2 + (mouseY - node.y) ** 2);
                    node.hover = dist < NODE_RADIUS;
                    if (node.hover) hovering = true;
                });
                draw();
                canvas.style.cursor = hovering ? 'pointer' : 'grab';
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left - offsetX) / scale;
            const mouseY = (e.clientY - rect.top - offsetY) / scale;

            nodes.forEach(node => {
                const dist = Math.sqrt((mouseX - node.x) ** 2 + (mouseY - node.y) ** 2);
                if (dist < NODE_RADIUS) {
                    showNodeInfo(node);
                }
            });
        });

        // Mostrar informações do nó
        function showNodeInfo(node) {
            document.getElementById('info-file').textContent = node.filePath;
            document.getElementById('info-imports').textContent = 
                node.imports.length > 0 
                    ? node.imports.map(id => {
                        const n = nodes.find(n => n.id === id);
                        return n ? n.filePath.split(/[\/\\]/).pop() : id;
                    }).join(', ')
                    : 'Nenhum';
            document.getElementById('info-imported-by').textContent = 
                node.importedBy.length > 0 
                    ? node.importedBy.map(id => {
                        const n = nodes.find(n => n.id === id);
                        return n ? n.filePath.split(/[\/\\]/).pop() : id;
                    }).join(', ')
                    : 'Nenhum';
            infoPanel.style.display = 'block';
        }

        // Resetar visualização
        function resetView() {
            offsetX = canvas.width / 2;
            offsetY = 100;
            scale = 1;
            draw();
        }

        // Zoom com scroll
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            scale *= delta;
            scale = Math.max(0.1, Math.min(scale, 3));
            draw();
        });

        // Redimensionar canvas
        window.addEventListener('resize', () => {
            initCanvas();
            draw();
        });

        // Inicializar
        initCanvas();
    </script>
</body>
</html>
