<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HaskTreeView - Visualizador de Dependências</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #header {
            padding: 20px;
            text-align: center;
            background-color: #111;
            border-bottom: 2px solid #333;
        }

        #header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        #header p {
            color: #888;
            font-size: 14px;
        }

        #controls {
            padding: 15px;
            background-color: #111;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
        }

        #controls label {
            color: #fff;
            font-size: 14px;
        }

        #controls input[type="file"] {
            padding: 8px 15px;
            background-color: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
        }

        #controls button {
            padding: 8px 20px;
            background-color: #0066cc;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        #controls button:hover {
            background-color: #0052a3;
        }

        #canvas-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 160px);
            overflow: auto;
        }

        canvas {
            display: block;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        #info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: rgba(17, 17, 17, 0.95);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            max-width: 300px;
            display: none;
        }

        #info h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #0066cc;
        }

        #info p {
            font-size: 13px;
            margin: 5px 0;
            color: #ccc;
        }

        #info .label {
            color: #888;
            font-weight: bold;
        }

        #stats {
            position: fixed;
            top: 180px;
            right: 20px;
            background-color: rgba(17, 17, 17, 0.95);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            min-width: 200px;
        }

        #stats h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #0066cc;
        }

        #stats p {
            font-size: 12px;
            margin: 5px 0;
            color: #ccc;
        }

        #legend {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: rgba(17, 17, 17, 0.95);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            min-width: 200px;
        }

        #legend h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #0066cc;
        }

        #legend .legend-item {
            display: flex;
            align-items: center;
            margin: 8px 0;
            font-size: 12px;
        }

        #legend .legend-circle {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 10px;
            border: 2px solid #000;
        }

        #legend .legend-line {
            width: 30px;
            height: 2px;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>🌳 HaskTreeView</h1>
        <p>Visualizador de Árvore de Dependências</p>
    </div>

    <div id="controls">
        <label for="fileInput">Carregar JSON:</label>
        <input type="file" id="fileInput" accept=".json">
        <button onclick="resetView()">Resetar Visualização</button>
        <button onclick="loadDefaultJson()">Carregar Exemplo</button>
    </div>

    <div id="canvas-container">
        <canvas id="canvas"></canvas>
    </div>

    <div id="info">
        <h3 id="info-title">Informações do Nó</h3>
        <p><span class="label">Arquivo:</span> <span id="info-file"></span></p>
        <p><span class="label">Importa:</span> <span id="info-imports"></span></p>
        <p><span class="label">Importado por:</span> <span id="info-imported-by"></span></p>
    </div>

    <div id="stats">
        <h3>Estatísticas</h3>
        <p><span class="label">Projeto:</span> <span id="stat-project">-</span></p>
        <p><span class="label">Total de arquivos:</span> <span id="stat-files">0</span></p>
        <p><span class="label">Total de conexões:</span> <span id="stat-connections">0</span></p>
        <p><span class="label">Ciclos detectados:</span> <span id="stat-cycles" style="color: #ff3333;">0</span></p>
        <p><span class="label">Analisado em:</span> <span id="stat-date">-</span></p>
    </div>

    <div id="legend">
        <h3>Legenda</h3>
        <div class="legend-item">
            <div class="legend-circle" style="background-color: #fff;"></div>
            <span>Nó normal</span>
        </div>
        <div class="legend-item">
            <div class="legend-circle" style="background-color: #ff3333;"></div>
            <span>Nó em ciclo</span>
        </div>
        <div class="legend-item">
            <div class="legend-line" style="background-color: #fff;"></div>
            <span>Dependência normal</span>
        </div>
        <div class="legend-item">
            <div class="legend-line" style="background-color: #ff3333;"></div>
            <span>Dependência circular</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const infoPanel = document.getElementById('info');

        let data = null;
        let nodes = [];
        let connections = [];
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let lastX = 0;
        let lastY = 0;
        let scale = 1;

        // Configurações visuais
        const NODE_RADIUS = 20;
        const NODE_COLOR = '#fff';
        const NODE_HOVER_COLOR = '#0066cc';
        const NODE_CIRCULAR_COLOR = '#ff3333'; // Vermelho para nós circulares
        const LINE_COLOR = '#fff';
        const LINE_CIRCULAR_COLOR = '#ff3333'; // Vermelho para conexões circulares
        const LINE_WIDTH = 2;
        const VERTICAL_SPACING = 150;
        const HORIZONTAL_SPACING = 200;

        // Inicializar canvas
        function initCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            offsetX = canvas.width / 2;
            offsetY = 100;
        }

        // Carregar JSON do input
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        data = JSON.parse(event.target.result);
                        processData();
                        draw();
                    } catch (error) {
                        alert('Erro ao carregar JSON: ' + error.message);
                    }
                };
                reader.readAsText(file);
            }
        });

        // Carregar JSON padrão
        function loadDefaultJson() {
            fetch('dependencies.json')
                .then(response => response.json())
                .then(jsonData => {
                    data = jsonData;
                    processData();
                    draw();
                })
                .catch(error => {
                    alert('Erro ao carregar JSON padrão: ' + error.message);
                });
        }

        // Detectar ciclos no grafo
        function detectCycles() {
            const cycles = [];
            const visited = new Set();
            const recursionStack = new Set();
            
            function dfs(nodeId, path) {
                if (recursionStack.has(nodeId)) {
                    // Encontrou um ciclo
                    const cycleStart = path.indexOf(nodeId);
                    const cycle = path.slice(cycleStart);
                    cycles.push(cycle);
                    return;
                }
                
                if (visited.has(nodeId)) return;
                
                visited.add(nodeId);
                recursionStack.add(nodeId);
                
                const node = data.dependencies.find(d => d.fileId === nodeId);
                if (node) {
                    node.imports.forEach(importId => {
                        dfs(importId, [...path, nodeId]);
                    });
                }
                
                recursionStack.delete(nodeId);
            }
            
            data.dependencies.forEach(dep => {
                if (!visited.has(dep.fileId)) {
                    dfs(dep.fileId, []);
                }
            });
            
            return cycles;
        }

        // Processar dados do JSON
        function processData() {
            if (!data) return;

            nodes = [];
            connections = [];

            // Atualizar estatísticas
            document.getElementById('stat-project').textContent = data.projectName || '-';
            document.getElementById('stat-files').textContent = data.dependencies.length;
            document.getElementById('stat-date').textContent = data.analyzedAt || '-';

            // Detectar ciclos
            const cycles = detectCycles();
            const nodesInCycles = new Set();
            cycles.forEach(cycle => cycle.forEach(nodeId => nodesInCycles.add(nodeId)));
            
            // Atualizar contador de ciclos
            document.getElementById('stat-cycles').textContent = cycles.length;
            
            console.log('Ciclos detectados:', cycles);
            console.log('Nós em ciclos:', Array.from(nodesInCycles));

            // Se todos os nós estão em um ciclo, usar layout circular
            if (nodesInCycles.size === data.dependencies.length && cycles.length > 0) {
                console.log('Usando layout circular para ciclo completo');
                const cycle = cycles[0]; // Usar o primeiro ciclo detectado
                const radius = 150;
                const angleStep = (2 * Math.PI) / cycle.length;
                
                cycle.forEach((nodeId, index) => {
                    const angle = -Math.PI / 2 + index * angleStep; // Começar no topo
                    const dep = data.dependencies.find(d => d.fileId === nodeId);
                    const filePath = data.fileRegistry[nodeId] || nodeId;
                    
                    nodes.push({
                        id: nodeId,
                        x: Math.cos(angle) * radius,
                        y: Math.sin(angle) * radius,
                        filePath: filePath,
                        imports: dep.imports,
                        importedBy: dep.importedBy,
                        isCircular: true // Marcar como circular
                    });
                });
            } else {
                // Layout hierárquico normal
                const rootNodes = data.dependencies.filter(dep => dep.importedBy.length === 0);
                const depthMap = {};
                const queue = rootNodes.length > 0 ? 
                    rootNodes.map(node => ({ id: node.fileId, depth: 0, path: [] })) :
                    [{ id: data.dependencies[0].fileId, depth: 0, path: [] }];

                while (queue.length > 0) {
                    const { id, depth, path } = queue.shift();
                    
                    if (depthMap[id] !== undefined && depthMap[id] <= depth) {
                        continue;
                    }
                    
                    if (path.includes(id)) {
                        if (depthMap[id] === undefined) {
                            depthMap[id] = depth;
                        }
                        continue;
                    }

                    depthMap[id] = depth;

                    const node = data.dependencies.find(d => d.fileId === id);
                    if (node) {
                        const newPath = [...path, id];
                        node.imports.forEach(importId => {
                            queue.push({ id: importId, depth: depth + 1, path: newPath });
                        });
                    }
                }

                data.dependencies.forEach(dep => {
                    if (depthMap[dep.fileId] === undefined) {
                        depthMap[dep.fileId] = 0;
                    }
                });

                const nodesByDepth = {};
                data.dependencies.forEach(dep => {
                    const depth = depthMap[dep.fileId];
                    if (!nodesByDepth[depth]) nodesByDepth[depth] = [];
                    nodesByDepth[depth].push(dep);
                });

                Object.keys(nodesByDepth).sort((a, b) => Number(a) - Number(b)).forEach(depth => {
                    const nodesAtDepth = nodesByDepth[depth];
                    const totalWidth = (nodesAtDepth.length - 1) * HORIZONTAL_SPACING;
                    const startX = -totalWidth / 2;

                    nodesAtDepth.forEach((dep, index) => {
                        const filePath = data.fileRegistry[dep.fileId] || dep.fileId;
                        nodes.push({
                            id: dep.fileId,
                            x: startX + index * HORIZONTAL_SPACING,
                            y: Number(depth) * VERTICAL_SPACING,
                            filePath: filePath,
                            imports: dep.imports,
                            importedBy: dep.importedBy,
                            isCircular: nodesInCycles.has(dep.fileId) // Marcar se está em ciclo
                        });
                    });
                });
            }

            // Criar conexões e detectar bidirecionais
            let connectionCount = 0;
            const processedPairs = new Set();
            
            data.dependencies.forEach(dep => {
                dep.imports.forEach(importId => {
                    const from = nodes.find(n => n.id === dep.fileId);
                    const to = nodes.find(n => n.id === importId);
                    if (from && to) {
                        // Verificar se é bidirecional
                        const reverseExists = data.dependencies.find(d => 
                            d.fileId === importId && d.imports.includes(dep.fileId)
                        );
                        
                        const isBidirectional = reverseExists !== undefined;
                        const pairKey = [dep.fileId, importId].sort().join('-');
                        
                        // Se é bidirecional e já foi processado, pular
                        if (isBidirectional && processedPairs.has(pairKey)) {
                            return; // Não adicionar duplicata
                        }
                        
                        // Verificar se ambos os nós estão em um ciclo
                        const isCircular = from.isCircular && to.isCircular;
                        
                        connections.push({ 
                            from, 
                            to, 
                            isBidirectional,
                            isCircular // Marcar conexão como circular
                        });
                        
                        if (isBidirectional) {
                            processedPairs.add(pairKey);
                        }
                        
                        connectionCount++;
                    }
                });
            });

            document.getElementById('stat-connections').textContent = connectionCount;
            
            // Debug: mostrar conexões no console
            console.log('Conexões criadas:', connections.map(c => ({
                from: c.from.id,
                to: c.to.id,
                bidir: c.isBidirectional
            })));
        }

        // Desenhar tudo
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);

            // Desenhar conexões com setas
            connections.forEach(conn => {
                // Usar cor vermelha se a conexão for circular
                ctx.strokeStyle = conn.isCircular ? LINE_CIRCULAR_COLOR : LINE_COLOR;
                ctx.fillStyle = conn.isCircular ? LINE_CIRCULAR_COLOR : LINE_COLOR;
                
                const fromX = conn.from.x;
                const fromY = conn.from.y;
                const toX = conn.to.x;
                const toY = conn.to.y;
                
                // Calcular ângulo da linha
                const angle = Math.atan2(toY - fromY, toX - fromX);
                const endX = toX - Math.cos(angle) * NODE_RADIUS;
                const endY = toY - Math.sin(angle) * NODE_RADIUS;
                
                if (conn.isBidirectional) {
                    // Linha dupla para bidirecionais (como "=")
                    const spacing = 4; // Espaçamento entre as duas linhas
                    const perpX = -Math.sin(angle) * spacing;
                    const perpY = Math.cos(angle) * spacing;
                    
                    ctx.lineWidth = LINE_WIDTH;
                    
                    // Calcular pontos de início e fim ajustados para o raio do nó
                    const startX = fromX + Math.cos(angle) * NODE_RADIUS;
                    const startY = fromY + Math.sin(angle) * NODE_RADIUS;
                    const finishX = toX - Math.cos(angle) * NODE_RADIUS;
                    const finishY = toY - Math.sin(angle) * NODE_RADIUS;
                    
                    // Primeira linha (superior)
                    ctx.beginPath();
                    ctx.moveTo(startX + perpX, startY + perpY);
                    ctx.lineTo(finishX + perpX, finishY + perpY);
                    ctx.stroke();
                    
                    // Segunda linha (inferior)
                    ctx.beginPath();
                    ctx.moveTo(startX - perpX, startY - perpY);
                    ctx.lineTo(finishX - perpX, finishY - perpY);
                    ctx.stroke();
                    
                    // Desenhar setas em ambas as pontas
                    const arrowSize = 12;
                    const arrowSpread = Math.PI / 6;
                    
                    // Seta 1: aponta para 'to' (direção →)
                    const arrow1X = finishX + perpX;
                    const arrow1Y = finishY + perpY;
                    
                    ctx.beginPath();
                    ctx.moveTo(arrow1X, arrow1Y);
                    ctx.lineTo(
                        arrow1X - arrowSize * Math.cos(angle - arrowSpread),
                        arrow1Y - arrowSize * Math.sin(angle - arrowSpread)
                    );
                    ctx.lineTo(
                        arrow1X - arrowSize * Math.cos(angle + arrowSpread),
                        arrow1Y - arrowSize * Math.sin(angle + arrowSpread)
                    );
                    ctx.closePath();
                    ctx.fill();
                    
                    // Seta 2: aponta para 'from' (direção ←)
                    const reverseAngle = angle + Math.PI;
                    const arrow2X = startX - perpX;
                    const arrow2Y = startY - perpY;
                    
                    ctx.beginPath();
                    ctx.moveTo(arrow2X, arrow2Y);
                    ctx.lineTo(
                        arrow2X - arrowSize * Math.cos(reverseAngle - arrowSpread),
                        arrow2Y - arrowSize * Math.sin(reverseAngle - arrowSpread)
                    );
                    ctx.lineTo(
                        arrow2X - arrowSize * Math.cos(reverseAngle + arrowSpread),
                        arrow2Y - arrowSize * Math.sin(reverseAngle + arrowSpread)
                    );
                    ctx.closePath();
                    ctx.fill();
                    
                } else {
                    // Linha simples para unidirecionais
                    ctx.lineWidth = LINE_WIDTH;
                    
                    // Desenhar linha
                    ctx.beginPath();
                    ctx.moveTo(fromX, fromY);
                    ctx.lineTo(endX, endY);
                    ctx.stroke();
                    
                    // Desenhar seta na ponta
                    const arrowSize = 10;
                    const arrowSpread = Math.PI / 6;
                    
                    ctx.beginPath();
                    ctx.moveTo(endX, endY);
                    ctx.lineTo(
                        endX - arrowSize * Math.cos(angle - arrowSpread),
                        endY - arrowSize * Math.sin(angle - arrowSpread)
                    );
                    ctx.lineTo(
                        endX - arrowSize * Math.cos(angle + arrowSpread),
                        endY - arrowSize * Math.sin(angle + arrowSpread)
                    );
                    ctx.closePath();
                    ctx.fill();
                }
            });

            // Desenhar nós
            nodes.forEach(node => {
                ctx.beginPath();
                ctx.arc(node.x, node.y, NODE_RADIUS, 0, Math.PI * 2);
                
                // Escolher cor baseado no estado do nó
                let fillColor;
                if (node.hover) {
                    fillColor = NODE_HOVER_COLOR;
                } else if (node.isCircular) {
                    fillColor = NODE_CIRCULAR_COLOR;
                } else {
                    fillColor = NODE_COLOR;
                }
                
                ctx.fillStyle = fillColor;
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Desenhar texto do arquivo
                ctx.fillStyle = node.isCircular ? NODE_CIRCULAR_COLOR : '#fff';
                ctx.font = '12px monospace';
                ctx.textAlign = 'center';
                const fileName = node.filePath.split(/[\/\\]/).pop();
                ctx.fillText(fileName, node.x, node.y + NODE_RADIUS + 15);
            });

            ctx.restore();
        }

        // Eventos de mouse
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left - offsetX) / scale;
            const mouseY = (e.clientY - rect.top - offsetY) / scale;

            if (isDragging) {
                offsetX += e.clientX - lastX;
                offsetY += e.clientY - lastY;
                lastX = e.clientX;
                lastY = e.clientY;
                draw();
            } else {
                // Detectar hover
                let hovering = false;
                nodes.forEach(node => {
                    const dist = Math.sqrt((mouseX - node.x) ** 2 + (mouseY - node.y) ** 2);
                    node.hover = dist < NODE_RADIUS;
                    if (node.hover) hovering = true;
                });
                draw();
                canvas.style.cursor = hovering ? 'pointer' : 'grab';
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left - offsetX) / scale;
            const mouseY = (e.clientY - rect.top - offsetY) / scale;

            nodes.forEach(node => {
                const dist = Math.sqrt((mouseX - node.x) ** 2 + (mouseY - node.y) ** 2);
                if (dist < NODE_RADIUS) {
                    showNodeInfo(node);
                }
            });
        });

        // Mostrar informações do nó
        function showNodeInfo(node) {
            const circularWarning = node.isCircular ? ' ⚠️ (Dependência Circular)' : '';
            document.getElementById('info-title').textContent = 'Informações do Nó' + circularWarning;
            document.getElementById('info-title').style.color = node.isCircular ? '#ff3333' : '#0066cc';
            document.getElementById('info-file').textContent = node.filePath;
            document.getElementById('info-imports').textContent = 
                node.imports.length > 0 
                    ? node.imports.map(id => {
                        const n = nodes.find(n => n.id === id);
                        return n ? n.filePath.split(/[\/\\]/).pop() : id;
                    }).join(', ')
                    : 'Nenhum';
            document.getElementById('info-imported-by').textContent = 
                node.importedBy.length > 0 
                    ? node.importedBy.map(id => {
                        const n = nodes.find(n => n.id === id);
                        return n ? n.filePath.split(/[\/\\]/).pop() : id;
                    }).join(', ')
                    : 'Nenhum';
            infoPanel.style.display = 'block';
        }

        // Resetar visualização
        function resetView() {
            offsetX = canvas.width / 2;
            offsetY = 100;
            scale = 1;
            draw();
        }

        // Zoom com scroll
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            scale *= delta;
            scale = Math.max(0.1, Math.min(scale, 3));
            draw();
        });

        // Redimensionar canvas
        window.addEventListener('resize', () => {
            initCanvas();
            draw();
        });

        // Inicializar
        initCanvas();
    </script>
</body>
</html>
